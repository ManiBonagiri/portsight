server:
  port: 8080
  error:
    include-message: always

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: portsight-api

  # Database Persistence (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/portsight
    username: portsight_user
    password: portsight_secure_pass_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway handles schema migrations in production-grade systems
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Caching Layer (Redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Message Bus (Kafka)
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: portsight-analytics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: http://${OTEL_EXPORTER_HOST:localhost}:4318/v1/traces
  tracing:
    sampling:
      probability: 0.0 # Sample 100% of traces in development

# Custom Application Configurations
app:
  jwt:
    secret: ${JWT_SECRET:d3M5YTJnODk0cTU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
    access-token-expiration: 900000 # 15 Minutes (in milliseconds)
    refresh-token-expiration: 604800000 # 7 Days (in milliseconds)
  minio:
    url: http://${MINIO_HOST:localhost}:9000
    access-key: ${MINIO_ROOT_USER:minio_admin}
    secret-key: ${MINIO_ROOT_PASSWORD:minio_admin_pass_2026}
    bucket-name: portsight-reports
