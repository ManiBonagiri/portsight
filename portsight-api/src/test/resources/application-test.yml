spring:
  # Flyway will run migrations against the Testcontainers PostgreSQL instance
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Kafka — disabled for integration tests (not testing Kafka flows)
  kafka:
    bootstrap-servers: localhost:9092
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Schedulers disabled — we don't want nightly jobs firing during tests
  task:
    scheduling:
      enabled: false

# Disable OpenTelemetry tracing during tests
management:
  tracing:
    sampling:
      probability: 0.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

app:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItaW50ZWdyYXRpb24tdGVzdHMtb25seQ==
    access-token-expiration: 900000
    refresh-token-expiration: 604800000